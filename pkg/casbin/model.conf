# ================================================
# NEXORA E-COMMERCE - CASBIN RBAC MODEL
# ================================================
# Este modelo define la estructura de control de acceso basada en roles (RBAC)

[request_definition]
# r = sub (usuario/rol), obj (recurso), act (acción)
r = sub, obj, act

[policy_definition]
# p = sub (rol), obj (recurso), act (acción)
p = sub, obj, act

[role_definition]
# g = usuario, rol (herencia de roles)
g = _, _

[policy_effect]
# e = efecto de la política (allow por defecto)
# allow override: cualquier allow permite el acceso
e = some(where (p.eft == allow))

[matchers]
# m = expresión que evalúa la política
# Verifica si el rol del usuario tiene permiso para la acción sobre el recurso
m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act
