<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora — Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #0c0d0f; --bg-elev: #131416; --bg-surf: #18191d; --bg-hover: #23252a;
            --border: rgba(255,255,255,0.07); --border-strong: rgba(255,255,255,0.12);
            --text: #f0f1f3; --text-sec: #a0a5b1; --text-mut: #5a6072;
            --accent: #3b82f6; --accent-dim: rgba(59,130,246,0.12);
            --success: #22c55e; --success-dim: rgba(34,197,94,0.1);
            --warning: #f59e0b; --danger: #ef4444;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .app { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 56px 1fr; height: 100vh; }
        
        /* Topbar */
        .topbar {
            grid-column: 1 / -1;
            background: var(--bg-elev);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; cursor: pointer; }
        .logo-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .logo-icon svg { width: 18px; height: 18px; }
        .search { flex: 1; max-width: 400px; }
        .search input {
            width: 100%; height: 36px; background: var(--bg-surf); border: 1px solid var(--border);
            border-radius: 8px; padding: 0 12px; color: var(--text); font-size: 13px;
        }
        .spacer { flex: 1; }
        .user { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .avatar {
            width: 32px; height: 32px; background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 600;
        }
        .logout-btn {
            background: var(--bg-surf); border: 1px solid var(--border); border-radius: 8px;
            padding: 8px 14px; font-size: 12px; color: var(--text-sec); cursor: pointer;
        }
        .logout-btn:hover { background: var(--bg-hover); }
        
        /* Sidebar */
        .sidebar {
            background: var(--bg-elev); border-right: 1px solid var(--border);
            padding: 16px 12px; overflow-y: auto;
        }
        .nav-label {
            font-size: 10px; font-weight: 600; letter-spacing: 0.8px;
            text-transform: uppercase; color: var(--text-mut); padding: 8px 12px 8px;
        }
        .nav-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px;
            border-radius: 8px; color: var(--text-sec); font-size: 13px; cursor: pointer;
            transition: all 0.15s;
        }
        .nav-item:hover { background: var(--bg-hover); color: var(--text); }
        .nav-item.active { background: var(--accent-dim); color: var(--accent); }
        .nav-item svg { width: 16px; height: 16px; }
        
        /* Main */
        .main { overflow-y: auto; padding: 24px; }
        
        .page-title { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
        .page-sub { font-size: 13px; color: var(--text-mut); margin-bottom: 24px; }
        
        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat {
            background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; padding: 20px;
        }
        .stat-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .stat-icon {
            width: 32px; height: 32px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }
        .stat-icon.blue { background: var(--accent-dim); color: var(--accent); }
        .stat-icon.green { background: var(--success-dim); color: var(--success); }
        .stat-icon.yellow { background: rgba(245,158,11,0.1); color: var(--warning); }
        .stat-icon svg { width: 16px; height: 16px; }
        .stat-trend { font-size: 11px; font-family: 'DM Mono', monospace; padding: 2px 6px; border-radius: 4px; }
        .trend-up { background: var(--success-dim); color: var(--success); }
        .trend-down { background: rgba(239,68,68,0.1); color: var(--danger); }
        .stat-value { font-size: 28px; font-weight: 600; font-family: 'DM Mono', monospace; }
        .stat-label { font-size: 12px; color: var(--text-mut); margin-top: 4px; }
        
        /* Sections */
        .sections { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
        .card {
            background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px;
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; border-bottom: 1px solid var(--border);
        }
        .card-title { font-size: 14px; font-weight: 600; }
        .card-body { padding: 16px 20px; }
        
        /* Table */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 10px 0; color: var(--text-mut); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
        td { padding: 12px 0; border-bottom: 1px solid var(--border); color: var(--text-sec); }
        tr:last-child td { border: none; }
        .order-id { color: var(--text); font-family: 'DM Mono', monospace; font-weight: 500; }
        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 10px; font-weight: 500; padding: 3px 8px; border-radius: 4px;
        }
        .badge-green { background: var(--success-dim); color: var(--success); }
        .badge-blue { background: var(--accent-dim); color: var(--accent); }
        .badge-yellow { background: rgba(245,158,11,0.1); color: var(--warning); }
        
        .hidden { display: none; }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .app { grid-template-columns: 180px 1fr; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .sections { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 768px) {
            .app { grid-template-columns: 1fr; grid-template-rows: 56px 48px 1fr; }
            .sidebar { 
                grid-column: 1 / -1; 
                grid-row: 2;
                display: flex;
                overflow-x: auto;
                padding: 8px 12px;
                gap: 4px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .nav-label { display: none; }
            .nav-item { 
                flex-direction: column; 
                gap: 4px; 
                padding: 8px 12px;
                font-size: 11px;
                white-space: nowrap;
            }
            .nav-item svg { width: 18px; height: 18px; }
            .main { padding: 16px; }
            .stats { grid-template-columns: 1fr; gap: 12px; }
            .stat { padding: 16px; }
            .stat-value { font-size: 24px; }
            .page-title { font-size: 20px; }
            .search { display: none; }
            .user span { display: none; }
            .topbar { padding: 0 12px; }
            table { display: block; overflow-x: auto; }
        }
        
        @media (max-width: 480px) {
            .container { padding: 12px; }
            .logo h1 { font-size: 24px; }
            .stat { padding: 12px; }
            .stat-value { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div id="topbar-container"></div>
        <div id="sidebar-container" data-page="dashboard"></div>
        
        <main class="main">
            <h1 class="page-title">Dashboard</h1>
            <p class="page-sub" id="current-date">Cargando...</p>
            
            <div class="stats">
                <div class="stat">
                    <div class="stat-header">
                        <div class="stat-icon blue"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
                        <span class="stat-trend trend-up">↑ 18.4%</span>
                    </div>
                    <div class="stat-value">$84,291</div>
                    <div class="stat-label">Ingresos totales</div>
                </div>
                <div class="stat">
                    <div class="stat-header">
                        <div class="stat-icon green"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></div>
                        <span class="stat-trend trend-up">↑ 7.2%</span>
                    </div>
                    <div class="stat-value">1,847</div>
                    <div class="stat-label">Pedidos este mes</div>
                </div>
                <div class="stat">
                    <div class="stat-header">
                        <div class="stat-icon yellow"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
                        <span class="stat-trend trend-up">↑ 12.1%</span>
                    </div>
                    <div class="stat-value">24,309</div>
                    <div class="stat-label">Clientes activos</div>
                </div>
                <div class="stat">
                    <div class="stat-header">
                        <div class="stat-icon" style="background:rgba(239,68,68,0.1);color:var(--danger)"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div>
                        <span class="stat-trend trend-down">↓ 2.3%</span>
                    </div>
                    <div class="stat-value">3.8%</div>
                    <div class="stat-label">Tasa de conversión</div>
                </div>
            </div>
            
            <div class="sections">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Pedidos recientes</div>
                    </div>
                    <div class="card-body" style="padding:0">
                        <table>
                            <thead><tr><th>Pedido</th><th>Cliente</th><th>Monto</th><th>Estado</th><th>Fecha</th></tr></thead>
                            <tbody id="orders-table">
                                <tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text-mut)">Cargando pedidos...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header"><div class="card-title">Actividad reciente</div></div>
                    <div class="card-body" id="activity-list">
                        <div style="padding:8px 0;color:var(--text-mut);font-size:12px">Cargando...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        const API_URL = '/api';
        let token = localStorage.getItem('nexora_token');
        
        if (!token) {
            window.location.href = '/index.html';
        }
        
        // Set date
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').textContent = now.toLocaleDateString('es-CO', options);
        
        // Logout
        function logout() {
            localStorage.removeItem('nexora_token');
            localStorage.removeItem('nexora_user');
            window.location.href = '/index.html';
        }

        // Intercept 401 globally
        const _fetch = window.fetch;
        window.fetch = function(...args) {
            return _fetch.apply(this, args).then(res => {
                if (res.status === 401) {
                    Toast.warning('Sesión expirada', 'Tu sesión ha expirado, redirigiendo al login...');
                    setTimeout(logout, 1500);
                }
                return res;
            });
        };
        
        // Fetch orders
        async function loadOrders() {
            try {
                const res = await fetch(API_URL + '/users', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    const data = await res.json();
                    // Just show mock data for now
                    document.getElementById('orders-table').innerHTML = `
                        <tr><td class="order-id">#NX-4821</td><td>Carlos Rivera</td><td style="font-family:'DM Mono',monospace">$249.00</td><td><span class="badge badge-green">●</span> Completado</td><td>27 Mar</td></tr>
                        <tr><td class="order-id">#NX-4820</td><td>Ana Gómez</td><td style="font-family:'DM Mono',monospace">$89.99</td><td><span class="badge badge-blue">●</span> En tránsito</td><td>26 Mar</td></tr>
                        <tr><td class="order-id">#NX-4819</td><td>Luis Martínez</td><td style="font-family:'DM Mono',monospace">$1,240.00</td><td><span class="badge badge-yellow">●</span> Pendiente</td><td>26 Mar</td></tr>
                        <tr><td class="order-id">#NX-4818</td><td>María Torres</td><td style="font-family:'DM Mono',monospace">$349.50</td><td><span class="badge badge-green">●</span> Completado</td><td>25 Mar</td></tr>
                    `;
                }
            } catch (e) {
                document.getElementById('orders-table').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text-mut)">No se pudieron cargar los pedidos</td></tr>';
            }
        }
        
        loadOrders();
        
        document.getElementById('activity-list').innerHTML = `
            <div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
                <div style="width:8px;height:8px;background:var(--success);border-radius:50%;margin-top:5px"></div>
                <div><div style="font-size:12px"><strong>#NX-4821</strong> completado · $249.00</div><div style="font-size:10px;color:var(--text-mut)">hace 3 min</div></div>
            </div>
            <div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
                <div style="width:8px;height:8px;background:var(--accent);border-radius:50%;margin-top:5px"></div>
                <div><div style="font-size:12px">Nuevo cliente <strong>Laura M.</strong></div><div style="font-size:10px;color:var(--text-mut)">hace 12 min</div></div>
            </div>
            <div style="display:flex;gap:10px;padding:8px 0">
                <div style="width:8px;height:8px;background:var(--warning);border-radius:50%;margin-top:5px"></div>
                <div><div style="font-size:12px"><strong>Auriculares Pro</strong> stock bajo</div><div style="font-size:10px;color:var(--text-mut)">hace 28 min</div></div>
            </div>
        `;
    </script>
    <script src="/topbar.js"></script>
    <script src="/sidebar.js"></script>
    <script src="/toast.js"></script>
</body>
</html>
