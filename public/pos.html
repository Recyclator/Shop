<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexora — Punto de Venta</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #0c0d0f; --bg-elev: #131416; --bg-surf: #18191d; --bg-hover: #23252a;
            --border: rgba(255,255,255,0.07); --border-strong: rgba(255,255,255,0.12);
            --text: #f0f1f3; --text-sec: #a0a5b1; --text-mut: #5a6072;
            --accent: #3b82f6; --accent-dim: rgba(59,130,246,0.12);
            --success: #22c55e; --success-dim: rgba(34,197,94,0.1);
            --warning: #f59e0b; --danger: #ef4444;
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        
        .topbar { background: var(--bg-elev); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 12px 16px; gap: 12px; position: sticky; top: 0; z-index: 100; }
        .logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; }
        .logo-icon { width: 28px; height: 28px; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
        .logo-icon svg { width: 14px; height: 14px; }
        .spacer { flex: 1; }
        .user { display: flex; align-items: center; gap: 8px; }
        .avatar { width: 28px; height: 28px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
        
        .nav-tabs { display: flex; background: var(--bg-elev); border-bottom: 1px solid var(--border); padding: 0 8px; overflow-x: auto; }
        .nav-tab { padding: 12px 16px; font-size: 13px; color: var(--text-mut); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
        .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        
        .main { display: none; }
        .main.active { display: block; }
        .sales-view { padding: 12px; }
        #main-sales.active { display: block; }
        
        /* Products View */
        .products-view { padding: 12px; }
        .search-box { margin-bottom: 12px; }
        .search-box input { width: 100%; height: 44px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; padding: 0 14px; color: var(--text); font-size: 14px; }
        .search-box input:focus { outline: none; border-color: var(--accent); }
        
        .barcode-row { display: flex; gap: 8px; margin-bottom: 16px; }
        .barcode-row input { flex: 1; height: 44px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; padding: 0 14px; color: var(--text); font-size: 14px; }
        .barcode-btn { width: 44px; height: 44px; background: var(--accent); border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .product-card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; padding: 10px; cursor: pointer; transition: all 0.15s; }
        .product-card:active { transform: scale(0.97); }
        .product-card.selected { border-color: var(--success); background: var(--success-dim); }
        .product-card.out-of-stock { opacity: 0.5; }
        .product-img { width: 100%; height: 70px; background: var(--bg-surf); border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .product-img img { width: 100%; height: 100%; object-fit: cover; }
        .product-img svg { width: 24px; height: 24px; color: var(--text-mut); }
        .product-name { font-size: 12px; font-weight: 500; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-sku { font-size: 9px; color: var(--text-mut); font-family: 'DM Mono', monospace; }
        .product-price { font-size: 14px; font-weight: 600; color: var(--accent); font-family: 'DM Mono', monospace; margin-top: 4px; }
        
        /* Cart View */
        .cart-view { padding: 12px; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .cart-title { font-size: 16px; font-weight: 600; }
        .cart-clear { font-size: 12px; color: var(--danger); background: none; border: none; cursor: pointer; }
        
        .cart-items { max-height: 45vh; overflow-y: auto; margin-bottom: 12px; }
        .cart-empty { text-align: center; padding: 40px 20px; color: var(--text-mut); font-size: 13px; }
        
        .cart-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--bg-elev); border-radius: 10px; margin-bottom: 8px; }
        .cart-item-info { flex: 1; min-width: 0; }
        .cart-item-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cart-item-price { font-size: 11px; color: var(--text-mut); font-family: 'DM Mono', monospace; }
        
        .qty-control { display: flex; align-items: center; gap: 8px; background: var(--bg-surf); border-radius: 8px; padding: 4px; }
        .qty-btn { width: 28px; height: 28px; border: none; background: var(--bg-hover); color: var(--text); border-radius: 6px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .qty-btn:active { background: var(--accent); }
        .qty-value { font-size: 14px; font-weight: 600; min-width: 24px; text-align: center; font-family: 'DM Mono', monospace; }
        
        .cart-item-total { font-size: 13px; font-weight: 600; font-family: 'DM Mono', monospace; min-width: 60px; text-align: right; }
        .cart-item-remove { color: var(--danger); background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px; }
        
        .cart-totals { background: var(--bg-elev); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
        .cart-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
        .cart-row.total { font-size: 18px; font-weight: 600; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
        .cart-row.total .value { color: var(--success); font-family: 'DM Mono', monospace; }
        
        .payment-methods { margin-bottom: 12px; }
        .payment-label { font-size: 11px; color: var(--text-mut); margin-bottom: 8px; text-transform: uppercase; }
        .payment-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .payment-btn { padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-sec); font-size: 12px; cursor: pointer; text-align: center; }
        .payment-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
        
        .cash-input { margin-bottom: 12px; }
        .cash-input label { display: block; font-size: 11px; color: var(--text-mut); margin-bottom: 6px; }
        .cash-input input { width: 100%; height: 44px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; padding: 0 14px; color: var(--text); font-size: 16px; font-family: 'DM Mono', monospace; }
        .change-display { font-size: 14px; color: var(--success); text-align: right; font-family: 'DM Mono', monospace; margin-top: 6px; }
        
        .btn-complete { width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; border: none; cursor: pointer; background: var(--success); color: white; }
        .btn-complete:disabled { background: var(--bg-surf); color: var(--text-mut); cursor: not-allowed; }
        .btn-complete:active:not(:disabled) { transform: scale(0.98); }
        
        /* Floating Cart Button */
        .floating-cart { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: var(--success); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(34,197,94,0.4); cursor: pointer; z-index: 99; }
        .floating-cart.hidden { display: none; }
        .floating-cart svg { width: 28px; height: 28px; color: white; }
        .floating-cart-badge { position: absolute; top: -4px; right: -4px; background: var(--danger); color: white; font-size: 12px; font-weight: 600; min-width: 22px; height: 22px; border-radius: 11px; display: flex; align-items: center; justify-content: center; }
        
        /* Success Modal */
        .success-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
        .success-overlay.active { display: flex; }
        .success-modal { background: var(--bg-elev); border-radius: 16px; padding: 32px; text-align: center; max-width: 320px; margin: 20px; }
        .success-icon { width: 64px; height: 64px; background: var(--success-dim); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .success-icon svg { width: 32px; height: 32px; color: var(--success); }
        .success-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .success-order { font-size: 14px; color: var(--text-mut); margin-bottom: 4px; }
        .success-total { font-size: 28px; font-weight: 700; color: var(--success); font-family: 'DM Mono', monospace; margin-bottom: 8px; }
        .success-change { font-size: 14px; color: var(--text-sec); margin-bottom: 20px; }
        
        /* Scanner */
        .scanner-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; }
        .scanner-overlay.active { display: block; }
        .scanner-container { position: relative; height: 60vh; }
        .scanner-video { width: 100%; height: 100%; object-fit: cover; }
        .scanner-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: rgba(0,0,0,0.5); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; border: none; cursor: pointer; }
        
        /* Toast */
        .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; padding: 12px 20px; font-size: 13px; z-index: 150; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
        .toast.success { border-color: var(--success); }
        
        /* Sales View */
        .sales-view { padding: 12px; }
        .sales-filters { margin-bottom: 12px; }
        .sales-filters select { width: 100%; height: 40px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; padding: 0 12px; }
        .sales-table-wrapper { overflow-x: auto; margin-bottom: 12px; }
        .sales-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .sales-table th { text-align: left; padding: 10px 8px; background: var(--bg-elev); color: var(--text-mut); font-weight: 500; border-bottom: 1px solid var(--border); }
        .sales-table td { padding: 10px 8px; border-bottom: 1px solid var(--border); }
        .sales-table tr:active { background: var(--bg-hover); }
        .sales-table .order-num { font-family: 'DM Mono', monospace; font-weight: 600; color: var(--accent); }
        .sales-table .total { font-family: 'DM Mono', monospace; font-weight: 600; color: var(--success); }
        .sales-table .method { font-size: 10px; padding: 4px 8px; background: var(--bg-surf); border-radius: 4px; }
        .sales-pagination { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .page-btn { padding: 10px 16px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; cursor: pointer; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .page-btn:active:not(:disabled) { background: var(--accent); }
        #page-info { font-size: 12px; color: var(--text-mut); }
        
        @media (min-width: 768px) {
            .app { display: grid; grid-template-columns: 200px 1fr 350px; height: 100vh; }
            .topbar { grid-column: 1 / -1; }
            .nav-tabs { grid-column: 2; display: none; }
            .main.active { display: grid; grid-template-columns: 1fr 350px; height: calc(100vh - 56px); }
            .products-view, .cart-view, .sales-view { height: 100%; overflow-y: auto; }
            .products-grid { grid-template-columns: repeat(3, 1fr); }
            .floating-cart { display: none; }
            .main { display: grid; grid-column: 2 / -1; }
            .products-view, .sales-view { padding: 20px; }
            .cart-view { border-left: 1px solid var(--border); }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="logo" onclick="location.href='/dashboard.html'">
                <div class="logo-icon"><svg viewBox="0 0 16 16" fill="white"><path d="M3 3h4v4H3zM9 3h4v4H9zM3 9h4v4H3zM11 9l2 4-4-2 2-2z"/></svg></div>
                <span>Nexora</span>
            </div>
            <div class="spacer"></div>
            <div class="user">
                <div class="avatar" id="user-avatar">?</div>
            </div>
        </header>
        
        <nav class="nav-tabs">
            <div class="nav-tab active" data-view="products" onclick="switchView('products')">Productos</div>
            <div class="nav-tab" data-view="cart" onclick="switchView('cart')">Carrito <span id="cart-count-badge">0</span></div>
            <div class="nav-tab" data-view="sales" onclick="switchView('sales')">Ventas</div>
        </nav>
        
        <div class="main active" id="main-products">
            <div class="products-view">
                <div class="search-box">
                    <input type="text" id="product-search" placeholder="Buscar producto..." oninput="searchProducts()">
                </div>
                <div class="barcode-row">
                    <input type="text" id="barcode-input" placeholder="Código de barras..." onkeypress="handleBarcodeKey(event)">
                    <button class="barcode-btn" onclick="openScanner()">
                        <svg width="20" height="20" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
                    </button>
                </div>
                <div class="products-grid" id="products-grid"></div>
            </div>
        </div>
        
        <div class="main" id="main-cart">
            <div class="cart-view">
                <div class="cart-header">
                    <div class="cart-title">Carrito</div>
                    <button class="cart-clear" onclick="clearCart()">Limpiar</button>
                </div>
                
                <div class="cart-items" id="cart-items">
                    <div class="cart-empty">No hay productos</div>
                </div>
                
                <div class="cart-totals">
                    <div class="cart-row"><span>Subtotal</span><span id="subtotal">$0</span></div>
                    <div class="cart-row"><span>IVA (19%)</span><span id="tax">$0</span></div>
                    <div class="cart-row total"><span>Total</span><span class="value" id="total">$0</span></div>
                </div>
                
                <div class="payment-methods">
                    <div class="payment-label">Método de pago</div>
                    <div class="payment-options">
                        <div class="payment-btn active" data-method="efectivo" onclick="selectPayment('efectivo')">Efectivo</div>
                        <div class="payment-btn" data-method="tarjeta" onclick="selectPayment('tarjeta')">Tarjeta</div>
                        <div class="payment-btn" data-method="transferencia" onclick="selectPayment('transferencia')">Transferencia</div>
                        <div class="payment-btn" data-method="nequi" onclick="selectPayment('nequi')">Nequi</div>
                    </div>
                </div>
                
                <div class="cash-input" id="cash-input-div">
                    <label>Monto recibido</label>
                    <input type="number" id="cash-received" placeholder="0" oninput="calculateChange()">
                    <div class="change-display" id="change-display"></div>
                </div>
                
                <button class="btn-complete" id="btn-complete" onclick="completeSale()" disabled>Completar Venta</button>
            </div>
        </div>
        
        <div class="main" id="main-sales">
            <div class="sales-view">
                <div class="cart-header">
                    <div class="cart-title">Historial de Ventas</div>
                </div>
                <div class="sales-filters">
                    <select id="sales-date-filter" onchange="loadSales()">
                        <option value="today">Hoy</option>
                        <option value="week">Esta semana</option>
                        <option value="month" selected>Este mes</option>
                        <option value="all">Todas</option>
                    </select>
                </div>
                <div class="sales-table-wrapper">
                    <table class="sales-table">
                        <thead>
                            <tr>
                                <th>Orden</th>
                                <th>Hora</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Método</th>
                            </tr>
                        </thead>
                        <tbody id="sales-tbody"></tbody>
                    </table>
                </div>
                <div class="sales-pagination">
                    <button class="page-btn" id="btn-prev" onclick="changePage(-1)" disabled>Anterior</button>
                    <span id="page-info">Página 1</span>
                    <button class="page-btn" id="btn-next" onclick="changePage(1)" disabled>Siguiente</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="floating-cart hidden" id="floating-cart" onclick="switchView('cart')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <div class="floating-cart-badge" id="floating-badge">0</div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <div class="success-overlay" id="success-overlay">
        <div class="success-modal">
            <div class="success-icon"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
            <div class="success-title">¡Venta Exitosa!</div>
            <div class="success-order" id="success-order"></div>
            <div class="success-total" id="success-total"></div>
            <div class="success-change" id="success-change"></div>
            <button class="btn-complete" onclick="closeSuccess()">Nueva Venta</button>
        </div>
    </div>
    
    <div class="scanner-overlay" id="scanner-overlay">
        <button class="scanner-close" onclick="closeScanner()">&times;</button>
        <div class="scanner-container">
            <video id="scanner-video" class="scanner-video" autoplay playsinline></video>
        </div>
    </div>
    
    <script>
        const API_URL = '/api';
        let token = localStorage.getItem('nexora_token');
        let cart = [];
        let products = [];
        let selectedPayment = 'efectivo';
        let salesPage = 1;
        let salesTotalPages = 1;
        
        if (!token) window.location.href = '/index.html';
        
        const userStr = localStorage.getItem('nexora_user');
        if (userStr) {
            const user = JSON.parse(userStr);
            document.getElementById('user-avatar').textContent = user.nombre ? user.nombre.charAt(0).toUpperCase() : '?';
        }
        
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        async function loadProducts() {
            try {
                const res = await fetch(`${API_URL}/products?limit=100&estado=activo`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    const data = await res.json();
                    products = data.data || [];
                    renderProducts(products);
                }
            } catch (e) {
                console.error(e);
            }
        }
        
        function renderProducts(list) {
            if (list.length === 0) {
                document.getElementById('products-grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-mut)">No hay productos</div>';
                return;
            }
            document.getElementById('products-grid').innerHTML = list.map(p => `
                <div class="product-card ${p.stock <= 0 ? 'out-of-stock' : ''}" onclick="addToCart(${p.id})">
                    <div class="product-img">
                        ${p.imagen_principal ? `<img src="${p.imagen_principal}" alt="${p.nombre}">` : 
                        '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>'}
                    </div>
                    <div class="product-name">${p.nombre}</div>
                    <div class="product-sku">${p.sku}</div>
                    <div class="product-price">$${formatNumber(p.precio)}</div>
                    ${p.stock > 0 ? `<div class="product-stock">Stock: ${p.stock}</div>` : '<div class="product-stock" style="color:var(--danger)">Sin stock</div>'}
                </div>
            `).join('');
        }
        
        function searchProducts() {
            const q = document.getElementById('product-search').value.toLowerCase();
            if (!q) { renderProducts(products); return; }
            const filtered = products.filter(p => 
                p.nombre.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q)
            );
            renderProducts(filtered);
        }
        
        function handleBarcodeKey(e) {
            if (e.key === 'Enter') {
                const code = e.target.value.trim();
                if (code) searchByBarcode(code);
                e.target.value = '';
            }
        }
        
        async function searchByBarcode(code) {
            try {
                const res = await fetch(`${API_URL}/products/barcode/${encodeURIComponent(code)}`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    const data = await res.json();
                    addToCart(data.data.id);
                } else {
                    showToast('Producto no encontrado', 'error');
                }
            } catch (e) {
                showToast('Error al buscar', 'error');
            }
        }
        
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            const existing = cart.find(item => item.producto_id === productId);
            if (existing) {
                if (product.stock > 0 && existing.cantidad < product.stock) {
                    existing.cantidad++;
                } else if (product.stock > 0) {
                    showToast(`Stock máximo: ${product.stock}`, 'error');
                } else {
                    showToast('Sin stock disponible', 'error');
                }
            } else {
                if (product.stock > 0) {
                    cart.push({ producto_id: productId, cantidad: 1, precio: product.precio, nombre: product.nombre });
                } else {
                    showToast('Sin stock disponible', 'error');
                    return;
                }
            }
            renderCart();
            if (product.stock > 0) showToast(`${product.nombre} agregado`);
        }
        
        function updateQty(productId, delta) {
            const item = cart.find(i => i.producto_id === productId);
            if (!item) return;
            
            const product = products.find(p => p.id === productId);
            item.cantidad += delta;
            
            if (item.cantidad <= 0) {
                cart = cart.filter(i => i.producto_id !== productId);
            } else if (product && item.cantidad > product.stock) {
                item.cantidad = product.stock;
                showToast(`Stock máximo: ${product.stock}`, 'error');
            }
            renderCart();
        }
        
        function removeFromCart(productId) {
            cart = cart.filter(i => i.producto_id !== productId);
            renderCart();
        }
        
        function clearCart() {
            cart = [];
            renderCart();
        }
        
        function renderCart() {
            const itemsEl = document.getElementById('cart-items');
            const badge = document.getElementById('cart-count-badge');
            const floatingBadge = document.getElementById('floating-badge');
            const floatingCart = document.getElementById('floating-cart');
            
            const totalItems = cart.reduce((sum, item) => sum + item.cantidad, 0);
            badge.textContent = totalItems;
            floatingBadge.textContent = totalItems;
            floatingCart.classList.toggle('hidden', cart.length === 0);
            
            if (cart.length === 0) {
                itemsEl.innerHTML = '<div class="cart-empty">No hay productos</div>';
                document.getElementById('subtotal').textContent = '$0';
                document.getElementById('tax').textContent = '$0';
                document.getElementById('total').textContent = '$0';
                document.getElementById('btn-complete').disabled = true;
                return;
            }
            
            let subtotal = 0;
            itemsEl.innerHTML = cart.map(item => {
                const total = item.precio * item.cantidad;
                subtotal += total;
                return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.nombre}</div>
                            <div class="cart-item-price">$${formatNumber(item.precio)} c/u</div>
                        </div>
                        <div class="qty-control">
                            <button class="qty-btn" onclick="updateQty(${item.producto_id}, -1)">-</button>
                            <span class="qty-value">${item.cantidad}</span>
                            <button class="qty-btn" onclick="updateQty(${item.producto_id}, 1)">+</button>
                        </div>
                        <div class="cart-item-total">$${formatNumber(total)}</div>
                        <button class="cart-item-remove" onclick="removeFromCart(${item.producto_id})">&times;</button>
                    </div>
                `;
            }).join('');
            
            const tax = subtotal * 0.19;
            const total = subtotal + tax;
            
            document.getElementById('subtotal').textContent = '$' + formatNumber(subtotal);
            document.getElementById('tax').textContent = '$' + formatNumber(tax);
            document.getElementById('total').textContent = '$' + formatNumber(total);
            document.getElementById('btn-complete').disabled = cart.length === 0;
        }
        
        function selectPayment(method) {
            selectedPayment = method;
            document.querySelectorAll('.payment-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.method === method);
            });
            document.getElementById('cash-input-div').style.display = method === 'efectivo' ? 'block' : 'none';
        }
        
        function calculateChange() {
            const received = parseFloat(document.getElementById('cash-received').value) || 0;
            const total = parseFloat(document.getElementById('total').textContent.replace(/[$,]/g, '')) || 0;
            const change = received - total;
            
            if (change >= 0 && received > 0) {
                document.getElementById('change-display').textContent = 'Cambio: $' + formatNumber(change);
            } else {
                document.getElementById('change-display').textContent = '';
            }
        }
        
        async function completeSale() {
            if (cart.length === 0) return;
            
            const btn = document.getElementById('btn-complete');
            btn.disabled = true;
            btn.textContent = 'Procesando...';
            
            const payload = {
                items: cart.map(item => ({
                    producto_id: item.producto_id,
                    cantidad: item.cantidad
                })),
                metodo_pago: selectedPayment,
                recibido: parseFloat(document.getElementById('cash-received').value) || 0
            };
            
            try {
                const res = await fetch(`${API_URL}/orders/pos`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    const data = await res.json();
                    showSuccess(data.data);
                } else {
                    const err = await res.json();
                    const msg = err.error?.message || err.message || 'Error al procesar venta';
                    showToast(msg, 'error');
                }
            } catch (e) {
                alert('Error de conexión');
            }
            
            btn.disabled = false;
            btn.textContent = 'Completar Venta';
        }
        
        function showSuccess(data) {
            const total = data.total || 0;
            const cambio = data.cambio || 0;
            
            document.getElementById('success-order').textContent = 'Orden: ' + (data.order?.numero_orden || '');
            document.getElementById('success-total').textContent = '$' + formatNumber(total);
            document.getElementById('success-change').textContent = selectedPayment === 'efectivo' && cambio > 0 ? 'Cambio: $' + formatNumber(cambio) : '';
            document.getElementById('success-overlay').classList.add('active');
            
            loadProducts();
        }
        
        function closeSuccess() {
            document.getElementById('success-overlay').classList.remove('active');
            cart = [];
            renderCart();
            switchView('products');
        }
        
        async function openScanner() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                const video = document.getElementById('scanner-video');
                video.srcObject = stream;
                document.getElementById('scanner-overlay').classList.add('active');
                
                const detector = new BarcodeDetector({ formats: ['code_128', 'ean_13', 'ean_8', 'upc_a', 'upc_e'] });
                detectLoop(video, detector);
            } catch (e) {
                showToast('No se pudo abrir la cámara', 'error');
            }
        }
        
        async function detectLoop(video, detector) {
            if (!document.getElementById('scanner-overlay').classList.contains('active')) return;
            try {
                const barcodes = await detector.detect(video);
                if (barcodes.length > 0) {
                    closeScanner();
                    searchByBarcode(barcodes[0].rawValue);
                    return;
                }
            } catch (e) {}
            requestAnimationFrame(() => detectLoop(video, detector));
        }
        
        function closeScanner() {
            document.getElementById('scanner-overlay').classList.remove('active');
            const video = document.getElementById('scanner-video');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
        }
        
        function formatNumber(num) {
            return Math.round(num).toLocaleString('es-CO');
        }
        
        function switchView(view) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelector('.nav-tab[data-view="' + view + '"]').classList.add('active');
            document.getElementById('main-products').classList.toggle('active', view === 'products');
            document.getElementById('main-cart').classList.toggle('active', view === 'cart');
            document.getElementById('main-sales').classList.toggle('active', view === 'sales');
            if (view === 'sales') loadSales();
        }
        
        async function loadSales() {
            const dateFilter = document.getElementById('sales-date-filter').value;
            const limit = 15;
            const offset = (salesPage - 1) * limit;
            
            let fechaDesde = '';
            const now = new Date();
            if (dateFilter === 'today') {
                fechaDesde = now.toISOString().split('T')[0];
            } else if (dateFilter === 'week') {
                const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                fechaDesde = weekAgo.toISOString().split('T')[0];
            } else if (dateFilter === 'month') {
                const monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
                fechaDesde = monthAgo.toISOString().split('T')[0];
            }
            
            try {
                let url = `${API_URL}/orders?page=${salesPage}&limit=${limit}`;
                if (fechaDesde) url += `&fecha_desde=${fechaDesde}`;
                
                const res = await fetch(url, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    renderSales(data.data || []);
                    salesTotalPages = Math.ceil(data.total / limit) || 1;
                    document.getElementById('page-info').textContent = `Página ${salesPage} de ${salesTotalPages}`;
                    document.getElementById('btn-prev').disabled = salesPage <= 1;
                    document.getElementById('btn-next').disabled = salesPage >= salesTotalPages;
                }
            } catch (e) {
                console.error(e);
            }
        }
        
        function renderSales(orders) {
            const tbody = document.getElementById('sales-tbody');
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-mut);padding:40px;">No hay ventas</td></tr>';
                return;
            }
            tbody.innerHTML = orders.map(o => {
                const hora = new Date(o.created_at).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
                const items = o.items ? o.items.length : 0;
                return `
                    <tr>
                        <td class="order-num">${o.numero_orden}</td>
                        <td>${hora}</td>
                        <td>${items} item${items !== 1 ? 's' : ''}</td>
                        <td class="total">$${formatNumber(o.total)}</td>
                        <td><span class="method">${o.metodo_pago}</span></td>
                    </tr>
                `;
            }).join('');
        }
        
        function changePage(delta) {
            salesPage += delta;
            loadSales();
        }
        
        loadProducts();
    </script>
</body>
</html>
