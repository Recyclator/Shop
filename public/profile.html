<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora — Perfil</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #0c0d0f; --bg-elev: #131416; --bg-surf: #18191d; --bg-hover: #23252a;
            --border: rgba(255,255,255,0.07); --border-strong: rgba(255,255,255,0.12);
            --text: #f0f1f3; --text-sec: #a0a5b1; --text-mut: #5a6072;
            --accent: #3b82f6; --accent-dim: rgba(59,130,246,0.12);
            --success: #22c55e; --danger: #ef4444;
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        .app { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 56px 1fr; height: 100vh; }

        .topbar {
            grid-column: 1 / -1;
            background: var(--bg-elev);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; cursor: pointer; }
        .logo-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .logo-icon svg { width: 18px; height: 18px; }
        .spacer { flex: 1; }
        .user { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .avatar {
            width: 32px; height: 32px; background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 600;
        }
        .logout-btn {
            background: var(--bg-surf); border: 1px solid var(--border); border-radius: 8px;
            padding: 8px 14px; font-size: 12px; color: var(--text-sec); cursor: pointer;
        }

        .sidebar {
            background: var(--bg-elev); border-right: 1px solid var(--border);
            padding: 16px 12px; overflow-y: auto;
        }
        .nav-label {
            font-size: 10px; font-weight: 600; letter-spacing: 0.8px;
            text-transform: uppercase; color: var(--text-mut); padding: 8px 12px 8px;
        }
        .nav-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px;
            border-radius: 8px; color: var(--text-sec); font-size: 13px; cursor: pointer;
            transition: all 0.15s;
        }
        .nav-item:hover { background: var(--bg-hover); color: var(--text); }
        .nav-item.active { background: var(--accent-dim); color: var(--accent); }
        .nav-item svg { width: 16px; height: 16px; }

        .main { overflow-y: auto; padding: 24px; }

        .page-title { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
        .page-sub { font-size: 13px; color: var(--text-mut); margin-bottom: 24px; }

        .profile-header-card {
            display: flex; align-items: center; gap: 16px;
            background: var(--bg-elev); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; margin-bottom: 24px;
        }
        .profile-header-card .big-avatar {
            width: 64px; height: 64px; background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 16px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: 600; flex-shrink: 0;
        }
        .profile-header-card h3 { font-size: 20px; font-weight: 600; }
        .profile-header-card p { color: var(--text-sec); font-size: 14px; }

        .tabs { display: flex; gap: 4px; margin-bottom: 24px; background: var(--bg-elev); padding: 4px; border-radius: 10px; width: fit-content; }
        .tab { padding: 10px 20px; font-size: 14px; font-weight: 500; color: var(--text-sec); cursor: pointer; border-radius: 8px; transition: all 0.15s; }
        .tab.active { background: var(--accent); color: white; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .profile-card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card-header { margin-bottom: 20px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .card-header svg { width: 18px; height: 18px; color: var(--accent); }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: span 2; }
        .form-group label { font-size: 13px; font-weight: 500; color: var(--text-sec); }
        .form-group input, .form-group select { height: 44px; background: var(--bg-surf); border: 1px solid var(--border-strong); border-radius: 8px; padding: 0 14px; font-size: 14px; color: var(--text); outline: none; transition: border-color 0.2s; }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
        .form-group input::placeholder { color: var(--text-mut); }

        .form-actions { margin-top: 20px; display: flex; gap: 12px; }
        .btn { height: 44px; padding: 0 24px; background: var(--accent); border: none; border-radius: 8px; font-size: 14px; font-weight: 600; color: white; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.15s; }
        .btn:hover { background: #2563eb; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .msg { margin-top: 10px; font-size: 14px; }
        .msg.success { color: var(--success); }
        .msg.error { color: var(--danger); }

        @media (max-width: 1024px) {
            .app { grid-template-columns: 180px 1fr; }
        }

        @media (max-width: 768px) {
            .app { grid-template-columns: 1fr; grid-template-rows: 56px 48px 1fr; }
            .sidebar {
                grid-column: 1 / -1;
                grid-row: 2;
                display: flex;
                overflow-x: auto;
                padding: 8px 12px;
                gap: 4px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .nav-label { display: none; }
            .nav-item {
                flex-direction: column;
                gap: 4px;
                padding: 8px 12px;
                font-size: 11px;
                white-space: nowrap;
            }
            .nav-item svg { width: 18px; height: 18px; }
            .main { padding: 16px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: span 1; }
            .search { display: none; }
            .user span { display: none; }
            .topbar { padding: 0 12px; }
        }

        @media (max-width: 480px) {
            .main { padding: 12px; }
            .page-title { font-size: 20px; }
            .profile-header-card { flex-direction: column; text-align: center; }
            .tabs { width: 100%; }
            .tab { flex: 1; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div id="topbar-container"></div>
        <div id="sidebar-container" data-page="profile"></div>

        <main class="main">
            <h1 class="page-title">Perfil</h1>
            <p class="page-sub">Gestiona tu información personal y seguridad</p>

            <div class="profile-header-card">
                <div class="big-avatar" id="header-avatar">?</div>
                <div>
                    <h3 id="header-name">Cargando...</h3>
                    <p id="header-email">...</p>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active" onclick="switchTab('personal')">Personal</div>
                <div class="tab" onclick="switchTab('security')">Seguridad</div>
            </div>

            <!-- Tab: Personal -->
            <div class="tab-content active" id="tab-personal">
                <form id="profile-form">
                    <div class="profile-card">
                        <div class="card-header">
                            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            Datos Personales
                        </div>
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Nombre</label>
                                <input type="text" id="nombre" placeholder="Tu nombre">
                            </div>
                            <div class="form-group">
                                <label>Apellido</label>
                                <input type="text" id="apellido" placeholder="Tu apellido">
                            </div>
                            <div class="form-group">
                                <label>Teléfono</label>
                                <input type="tel" id="telefono" placeholder="3001234567">
                            </div>
                            <div class="form-group">
                                <label>Tipo Documento</label>
                                <select id="tipo_documento">
                                    <option value="">Seleccionar</option>
                                    <option value="CC">Cédula</option>
                                    <option value="CE">Cédula Extranjería</option>
                                    <option value="NIT">NIT</option>
                                </select>
                            </div>
                            <div class="form-group full">
                                <label>Número de Documento</label>
                                <input type="text" id="numero_documento" placeholder="Número">
                            </div>
                            <div class="form-group full">
                                <label>Dirección</label>
                                <input type="text" id="direccion" placeholder="Dirección">
                            </div>
                            <div class="form-group">
                                <label>Ciudad</label>
                                <input type="text" id="ciudad" placeholder="Ciudad">
                            </div>
                            <div class="form-group">
                                <label>Departamento</label>
                                <input type="text" id="departamento" placeholder="Departamento">
                            </div>
                            <div class="form-group">
                                <label>País</label>
                                <select id="pais">
                                    <option value="CO" selected>Colombia</option>
                                    <option value="VE">Venezuela</option>
                                    <option value="EC">Ecuador</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Código Postal</label>
                                <input type="text" id="codigo_postal" placeholder="Código">
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn" id="save-btn">Guardar Cambios</button>
                    </div>
                    <div id="save-msg" class="msg"></div>
                </form>
            </div>

            <!-- Tab: Security -->
            <div class="tab-content" id="tab-security">
                <div class="profile-card">
                    <div class="card-header">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        Cambiar Contraseña
                    </div>
                    <form id="password-form">
                        <div class="form-grid">
                            <div class="form-group full">
                                <label>Contraseña Actual</label>
                                <input type="password" id="current-password" placeholder="Actual">
                            </div>
                            <div class="form-group">
                                <label>Nueva Contraseña</label>
                                <input type="password" id="new-password" placeholder="Nueva">
                            </div>
                            <div class="form-group">
                                <label>Confirmar</label>
                                <input type="password" id="confirm-password" placeholder="Confirmar">
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn" id="change-password-btn">Cambiar Contraseña</button>
                        </div>
                        <div id="password-msg" class="msg"></div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="/toast.js"></script>
    <script>
        const API_URL = '/api';
        const token = localStorage.getItem('nexora_token');

        if (!token) {
            window.location.href = '/index.html';
        }

        // Tab switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        function logout() {
            localStorage.removeItem('nexora_token');
            localStorage.removeItem('nexora_user');
            window.location.href = '/index.html';
        }

        // Intercept 401 globally
        const _fetch = window.fetch;
        window.fetch = function(...args) {
            return _fetch.apply(this, args).then(res => {
                if (res.status === 401) {
                    Toast.warning('Sesión expirada', 'Tu sesión ha expirado, redirigiendo al login...');
                    setTimeout(logout, 1500);
                }
                return res;
            });
        };

        loadProfile();

        function loadProfile() {
            fetch(API_URL + '/auth/profile', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const u = data.data;
                    document.getElementById('header-name').textContent = u.nombre || 'Usuario';
                    document.getElementById('header-email').textContent = u.email;
                    document.getElementById('header-avatar').textContent = (u.nombre || 'U').charAt(0).toUpperCase();

                    document.getElementById('nombre').value = u.nombre || '';
                    document.getElementById('apellido').value = u.apellido || '';
                    document.getElementById('telefono').value = u.telefono || '';
                    document.getElementById('tipo_documento').value = u.tipo_documento || '';
                    document.getElementById('numero_documento').value = u.numero_documento || '';
                    document.getElementById('direccion').value = u.direccion || '';
                    document.getElementById('ciudad').value = u.ciudad || '';
                    document.getElementById('departamento').value = u.departamento || '';
                    document.getElementById('pais').value = u.pais || 'CO';
                    document.getElementById('codigo_postal').value = u.codigo_postal || '';
                } else {
                    Toast.error('Error', data.error?.message || 'Error al cargar');
                }
            })
            .catch(err => {
                Toast.error('Error', 'Conexión: ' + err.message);
            });
        }

        document.getElementById('profile-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            const msg = document.getElementById('save-msg');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>';

            fetch(API_URL + '/auth/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({
                    nombre: document.getElementById('nombre').value,
                    apellido: document.getElementById('apellido').value,
                    telefono: document.getElementById('telefono').value,
                    tipo_documento: document.getElementById('tipo_documento').value,
                    numero_documento: document.getElementById('numero_documento').value,
                    direccion: document.getElementById('direccion').value,
                    ciudad: document.getElementById('ciudad').value,
                    departamento: document.getElementById('departamento').value,
                    pais: document.getElementById('pais').value,
                    codigo_postal: document.getElementById('codigo_postal').value
                })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.textContent = 'Guardar Cambios';
                if (data.success) {
                    msg.textContent = '¡Guardado correctamente!';
                    msg.className = 'msg success';
                } else {
                    msg.textContent = data.error?.message || 'Error';
                    msg.className = 'msg error';
                }
            })
            .catch(() => {
                btn.disabled = false;
                btn.textContent = 'Guardar Cambios';
                msg.textContent = 'Error de conexión';
                msg.className = 'msg error';
            });
        });

        document.getElementById('password-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const current = document.getElementById('current-password').value;
            const newPass = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;
            const btn = document.getElementById('change-password-btn');
            const msg = document.getElementById('password-msg');

            if (newPass !== confirm) {
                msg.textContent = 'Las contraseñas no coinciden';
                msg.className = 'msg error';
                return;
            }
            if (newPass.length < 6) {
                msg.textContent = 'Mínimo 6 caracteres';
                msg.className = 'msg error';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>';

            fetch(API_URL + '/auth/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ current_password: current, new_password: newPass, confirm_password: confirm })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.textContent = 'Cambiar Contraseña';
                if (data.success) {
                    msg.textContent = '¡Contraseña cambiada!';
                    msg.className = 'msg success';
                    document.getElementById('password-form').reset();
                } else {
                    msg.textContent = data.error?.message || 'Error';
                    msg.className = 'msg error';
                }
            })
            .catch(() => {
                btn.disabled = false;
                btn.textContent = 'Cambiar Contraseña';
                msg.textContent = 'Error de conexión';
                msg.className = 'msg error';
            });
        });
    </script>
    <script src="/topbar.js"></script>
    <script src="/sidebar.js"></script>
</body>
</html>
