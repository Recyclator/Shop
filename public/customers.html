<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora — Clientes</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #0c0d0f; --bg-elev: #131416; --bg-surf: #18191d; --bg-hover: #23252a;
            --border: rgba(255,255,255,0.07); --border-strong: rgba(255,255,255,0.12);
            --text: #f0f1f3; --text-sec: #a0a5b1; --text-mut: #5a6072;
            --accent: #3b82f6; --accent-dim: rgba(59,130,246,0.12);
            --success: #22c55e; --success-dim: rgba(34,197,94,0.1);
            --warning: #f59e0b; --danger: #ef4444;
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .app { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 56px 1fr; height: 100vh; }

        .topbar {
            grid-column: 1 / -1; background: var(--bg-elev); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 20px; gap: 16px;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; cursor: pointer; }
        .logo-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .logo-icon svg { width: 18px; height: 18px; }
        .search { flex: 1; max-width: 400px; }
        .search input {
            width: 100%; height: 36px; background: var(--bg-surf); border: 1px solid var(--border);
            border-radius: 8px; padding: 0 12px; color: var(--text); font-size: 13px;
        }
        .spacer { flex: 1; }
        .user { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .avatar {
            width: 32px; height: 32px; background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 600; cursor: pointer;
        }
        .logout-btn {
            background: var(--bg-surf); border: 1px solid var(--border); border-radius: 8px;
            padding: 8px 14px; font-size: 12px; color: var(--text-sec); cursor: pointer;
        }
        .logout-btn:hover { background: var(--bg-hover); }

        .sidebar {
            background: var(--bg-elev); border-right: 1px solid var(--border);
            padding: 16px 12px; overflow-y: auto;
        }
        .nav-label {
            font-size: 10px; font-weight: 600; letter-spacing: 0.8px;
            text-transform: uppercase; color: var(--text-mut); padding: 8px 12px 8px;
        }
        .nav-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px;
            border-radius: 8px; color: var(--text-sec); font-size: 13px; cursor: pointer;
            transition: all 0.15s;
        }
        .nav-item:hover { background: var(--bg-hover); color: var(--text); }
        .nav-item.active { background: var(--accent-dim); color: var(--accent); }
        .nav-item svg { width: 16px; height: 16px; }

        .main { overflow-y: auto; padding: 24px; }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .page-title { font-size: 24px; font-weight: 600; }
        .page-sub { font-size: 13px; color: var(--text-mut); margin-top: 4px; }

        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
            cursor: pointer; border: none; transition: all 0.15s;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: var(--bg-surf); color: var(--text-sec); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--bg-hover); }
        .btn-sm { padding: 6px 10px; font-size: 12px; }

        .toolbar {
            display: flex; gap: 12px; margin-bottom: 20px;
            background: var(--bg-elev); padding: 16px; border-radius: 12px; border: 1px solid var(--border);
        }
        .toolbar input {
            width: 100%; max-width: 300px; height: 36px; background: var(--bg-surf); border: 1px solid var(--border);
            border-radius: 8px; padding: 0 12px; color: var(--text); font-size: 13px;
        }

        .card {
            background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px;
        }
        .card-body { padding: 0; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 12px 16px; color: var(--text-mut); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
        td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-sec); }
        tr:last-child td { border: none; }
        tr:hover { background: var(--bg-hover); }

        .actions { display: flex; gap: 4px; }
        .action-btn {
            width: 28px; height: 28px; border-radius: 6px; border: none;
            background: transparent; color: var(--text-mut); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .action-btn:hover { background: var(--bg-hover); color: var(--text); }

        .pagination { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-top: 1px solid var(--border); }
        .pagination-info { font-size: 12px; color: var(--text-mut); }
        .pagination-buttons { display: flex; gap: 8px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center;
            z-index: 100;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px;
            width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; border-bottom: 1px solid var(--border);
        }
        .modal-title { font-size: 16px; font-weight: 600; }
        .modal-close { background: none; border: none; color: var(--text-mut); cursor: pointer; font-size: 20px; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 12px; font-weight: 500; color: var(--text-sec); margin-bottom: 6px; }
        .form-input {
            width: 100%; height: 40px; background: var(--bg-surf); border: 1px solid var(--border);
            border-radius: 8px; padding: 0 12px; color: var(--text); font-size: 13px;
        }
        .form-input:focus { outline: none; border-color: var(--accent); }

        @media (max-width: 768px) {
            .app { grid-template-columns: 1fr; grid-template-rows: 56px 48px auto 1fr; }
            .sidebar {
                grid-column: 1 / -1; grid-row: 2; display: flex;
                overflow-x: auto; padding: 8px 12px; gap: 4px;
                border-right: none; border-bottom: 1px solid var(--border);
            }
            .nav-label { display: none; }
            .nav-item {
                flex-direction: column; gap: 4px; padding: 8px 12px;
                font-size: 11px; white-space: nowrap;
            }
            .nav-item svg { width: 18px; height: 18px; }
            .main { padding: 16px; }
            .page-header { flex-direction: column; gap: 16px; align-items: stretch; }
            .search { display: none; }
            .user span { display: none; }
            .toolbar { flex-direction: column; }
            .toolbar input { width: 100%; max-width: none; }
            table { display: block; overflow-x: auto; }
            th, td { white-space: nowrap; }
            .modal { width: 95%; max-height: 85vh; margin: 10px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div id="topbar-container"></div>
        <div id="sidebar-container" data-page="customers"></div>

        <main class="main">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Clientes</h1>
                    <p class="page-sub" id="total-customers">Cargando...</p>
                </div>
                <button class="btn btn-primary" onclick="openModal()">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Nuevo Cliente
                </button>
            </div>

            <div class="toolbar">
                <input type="text" placeholder="Buscar por nombre, cédula, email..." id="search-filter">
                <button class="btn btn-secondary" onclick="loadCustomers()">Buscar</button>
            </div>

            <div class="card">
                <div class="card-body">
                    <table>
                        <thead>
                            <tr>
                                <th>Cédula</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th>Fecha Registro</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="customers-table"></tbody>
                    </table>
                </div>
            </div>

            <div class="pagination" id="pagination"></div>
        </main>
    </div>

    <div class="modal-overlay" id="customer-modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">Nuevo Cliente</div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="customer-form">
                    <input type="hidden" id="customer-id">
                    <div class="form-group">
                        <label class="form-label">Cédula *</label>
                        <input type="text" class="form-input" id="cedula" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nombre Completo *</label>
                        <input type="text" class="form-input" id="nombre" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email *</label>
                        <input type="email" class="form-input" id="email" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Teléfono *</label>
                        <input type="text" class="form-input" id="telefono" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveCustomer()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="/toast.js"></script>
    <script>
        const API_URL = '/api';
        let token = localStorage.getItem('nexora_token');

        if (!token) {
            window.location.href = '/index.html';
        }

        function logout() {
            localStorage.removeItem('nexora_token');
            localStorage.removeItem('nexora_user');
            window.location.href = '/index.html';
        }

        const _fetch = window.fetch;
        window.fetch = function(...args) {
            return _fetch.apply(this, args).then(res => {
                if (res.status === 401) {
                    Toast.warning('Sesión expirada', 'Tu sesión ha expirado, redirigiendo al login...');
                    setTimeout(logout, 1500);
                }
                return res;
            });
        };

        let currentPage = 1;
        let currentSearch = '';

        async function loadCustomers(page = 1) {
            currentPage = page;
            try {
                const url = `${API_URL}/customers?page=${page}&limit=20${currentSearch ? '&search=' + encodeURIComponent(currentSearch) : ''}`;
                const res = await fetch(url, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    const data = await res.json();
                    const customers = data.data || [];
                    const meta = data.meta || {};
                    renderCustomers(customers);
                    renderPagination(meta);
                    document.getElementById('total-customers').textContent = `${meta.total || 0} clientes registrados`;
                } else {
                    Toast.error('Error', 'No se pudieron cargar los clientes');
                }
            } catch (e) {
                Toast.error('Error', 'Error de conexión');
            }
        }

        function renderCustomers(customers) {
            const tbody = document.getElementById('customers-table');
            if (customers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-mut)">No hay clientes registrados</td></tr>';
                return;
            }
            tbody.innerHTML = customers.map(c => `
                <tr>
                    <td style="font-family:'DM Mono',monospace;font-size:12px">${c.cedula}</td>
                    <td style="font-weight:500;color:var(--text)">${c.nombre}</td>
                    <td>${c.email}</td>
                    <td>${c.telefono}</td>
                    <td>${new Date(c.created_at).toLocaleDateString('es-CO')}</td>
                    <td>
                        <div class="actions">
                            <button class="action-btn" onclick="editCustomer(${c.id})" title="Editar">
                                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                            </button>
                            <button class="action-btn" onclick="deleteCustomer(${c.id})" title="Eliminar">
                                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline x1="3" y1="6" x2="21" y2="6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function renderPagination(meta) {
            const totalPages = meta.total_pages || 1;
            if (totalPages <= 1) {
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            let html = `<div class="pagination-info">Mostrando ${((currentPage - 1) * 20) + 1}-${Math.min(currentPage * 20, meta.total)} de ${meta.total}</div>`;
            html += '<div class="pagination-buttons">';
            if (currentPage > 1) html += `<button class="btn btn-sm btn-secondary" onclick="loadCustomers(${currentPage - 1})">Anterior</button>`;
            if (currentPage < totalPages) html += `<button class="btn btn-sm btn-secondary" onclick="loadCustomers(${currentPage + 1})">Siguiente</button>`;
            html += '</div>';
            document.getElementById('pagination').innerHTML = html;
        }

        function openModal() {
            document.getElementById('modal-title').textContent = 'Nuevo Cliente';
            document.getElementById('customer-form').reset();
            document.getElementById('customer-id').value = '';
            document.getElementById('customer-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('customer-modal').classList.remove('active');
        }

        async function editCustomer(id) {
            try {
                const res = await fetch(`${API_URL}/customers/${id}`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    const data = await res.json();
                    const c = data.data;
                    document.getElementById('modal-title').textContent = 'Editar Cliente';
                    document.getElementById('customer-id').value = c.id;
                    document.getElementById('cedula').value = c.cedula;
                    document.getElementById('nombre').value = c.nombre;
                    document.getElementById('email').value = c.email;
                    document.getElementById('telefono').value = c.telefono;
                    document.getElementById('customer-modal').classList.add('active');
                }
            } catch (e) {
                Toast.error('Error', 'No se pudo cargar el cliente');
            }
        }

        async function saveCustomer() {
            const id = document.getElementById('customer-id').value;
            const cedula = document.getElementById('cedula').value.trim();
            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefono = document.getElementById('telefono').value.trim();

            if (!cedula || !nombre || !email || !telefono) {
                Toast.warning('Campos requeridos', 'Todos los campos son obligatorios');
                return;
            }

            const body = { cedula, nombre, email, telefono };

            try {
                let res;
                if (id) {
                    res = await fetch(`${API_URL}/customers/${id}`, {
                        method: 'PUT',
                        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                } else {
                    res = await fetch(`${API_URL}/customers`, {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                }

                const data = await res.json();
                if (res.ok) {
                    Toast.success('Éxito', id ? 'Cliente actualizado' : 'Cliente creado');
                    closeModal();
                    loadCustomers(currentPage);
                } else {
                    Toast.error('Error', data.error?.message || 'Error al guardar');
                }
            } catch (e) {
                Toast.error('Error', 'Error de conexión');
            }
        }

        async function deleteCustomer(id) {
            if (!confirm('¿Estás seguro de eliminar este cliente?')) return;

            try {
                const res = await fetch(`${API_URL}/customers/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (res.ok) {
                    Toast.success('Éxito', 'Cliente eliminado');
                    loadCustomers(currentPage);
                } else {
                    Toast.error('Error', data.error?.message || 'Error al eliminar');
                }
            } catch (e) {
                Toast.error('Error', 'Error de conexión');
            }
        }

        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                currentSearch = e.target.value;
                loadCustomers(1);
            }
        });

        document.getElementById('search-filter').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                currentSearch = e.target.value;
                loadCustomers(1);
            }
        });

        loadCustomers(1);
    </script>
    <script src="/topbar.js"></script>
    <script src="/sidebar.js"></script>
    <script src="/toast.js"></script>
</body>
</html>
