<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora — Roles y Permisos</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #0c0d0f; --bg-elev: #131416; --bg-surf: #18191d; --bg-hover: #23252a;
            --border: rgba(255,255,255,0.07); --border-strong: rgba(255,255,255,0.12);
            --text: #f0f1f3; --text-sec: #a0a5b1; --text-mut: #5a6072;
            --accent: #3b82f6; --accent-dim: rgba(59,130,246,0.12);
            --success: #22c55e; --success-dim: rgba(34,197,94,0.1);
            --warning: #f59e0b; --danger: #ef4444;
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .app { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 56px 1fr; height: 100vh; }
        .topbar { grid-column: 1 / -1; background: var(--bg-elev); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 16px; }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; cursor: pointer; }
        .logo-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .logo-icon svg { width: 18px; height: 18px; }
        .search { flex: 1; max-width: 400px; }
        .search input { width: 100%; height: 36px; background: var(--bg-surf); border: 1px solid var(--border); border-radius: 8px; padding: 0 12px; color: var(--text); font-size: 13px; }
        .spacer { flex: 1; }
        .user { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .avatar { width: 32px; height: 32px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; cursor: pointer; }
        .logout-btn { background: var(--bg-surf); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: 12px; color: var(--text-sec); cursor: pointer; }
        .logout-btn:hover { background: var(--bg-hover); }
        .sidebar { background: var(--bg-elev); border-right: 1px solid var(--border); padding: 16px 12px; overflow-y: auto; }
        .nav-label { font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-mut); padding: 8px 12px 8px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: var(--text-sec); font-size: 13px; cursor: pointer; transition: all 0.15s; }
        .nav-item:hover { background: var(--bg-hover); color: var(--text); }
        .nav-item.active { background: var(--accent-dim); color: var(--accent); }
        .nav-item svg { width: 16px; height: 16px; }
        .main { overflow-y: auto; padding: 24px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .page-title { font-size: 24px; font-weight: 600; }
        .page-sub { font-size: 13px; color: var(--text-mut); margin-top: 4px; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: var(--bg-surf); color: var(--text-sec); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--bg-hover); }
        .btn-sm { padding: 6px 10px; font-size: 12px; }
        .btn-danger { background: rgba(239,68,68,0.1); color: var(--danger); }
        .card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 16px; font-weight: 600; }
        .card-body { padding: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 12px 16px; color: var(--text-mut); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
        td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-sec); }
        tr:last-child td { border: none; }
        tr:hover { background: var(--bg-hover); }
        .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 500; padding: 3px 8px; border-radius: 4px; }
        .badge-blue { background: var(--accent-dim); color: var(--accent); }
        .badge-gray { background: rgba(90,96,114,0.2); color: var(--text-mut); }
        .actions { display: flex; gap: 4px; }
        .action-btn { width: 28px; height: 28px; border-radius: 6px; border: none; background: transparent; color: var(--text-mut); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .action-btn:hover { background: var(--bg-hover); color: var(--text); }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
        .modal-title { font-size: 16px; font-weight: 600; }
        .modal-close { background: none; border: none; color: var(--text-mut); cursor: pointer; font-size: 20px; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 12px; font-weight: 500; color: var(--text-sec); margin-bottom: 6px; }
        .form-input, .form-select { width: 100%; height: 40px; background: var(--bg-surf); border: 1px solid var(--border); border-radius: 8px; padding: 0 12px; color: var(--text); font-size: 13px; }
        .form-input:focus, .form-select:focus { outline: none; border-color: var(--accent); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .permissions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; max-height: 300px; overflow-y: auto; padding: 12px; background: var(--bg-surf); border-radius: 8px; }
        .permission-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg-elev); border-radius: 6px; font-size: 12px; }
        .permission-item input { accent-color: var(--accent); }
        .module-section { margin-bottom: 16px; }
        .module-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; padding: 8px 12px; background: var(--bg-surf); border-radius: 6px; }
        .module-perms { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 12px; }
        .module-perms label { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 8px; background: var(--bg-elev); border-radius: 4px; }
        .module-perms input { accent-color: var(--accent); }
        .protected-badge { background: rgba(245,158,11,0.1); color: var(--warning); padding: 2px 6px; border-radius: 4px; font-size: 9px; margin-left: 8px; }
        @media (max-width: 768px) {
            .app { grid-template-columns: 1fr; grid-template-rows: 56px 48px auto 1fr; }
            .sidebar { grid-column: 1 / -1; grid-row: 2; display: flex; overflow-x: auto; padding: 8px 12px; gap: 4px; border-right: none; border-bottom: 1px solid var(--border); }
            .nav-label { display: none; }
            .nav-item { flex-direction: column; gap: 4px; padding: 8px 12px; font-size: 11px; white-space: nowrap; }
            .nav-item svg { width: 18px; height: 18px; }
            .main { padding: 16px; }
            .page-header { flex-direction: column; gap: 16px; align-items: stretch; }
            .search { display: none; }
            .user span { display: none; }
            .modal { width: 95%; max-height: 85vh; margin: 10px; }
            .form-row { grid-template-columns: 1fr; }
            .permissions-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div id="topbar-container"></div>
        <div id="sidebar-container" data-page="roles-permissions"></div>

        <main class="main">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Roles y Permisos</h1>
                    <p class="page-sub">Gestión de roles y permisos del sistema (solo superadmin)</p>
                </div>
                <button class="btn btn-primary" onclick="openRoleModal()">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Nuevo Rol
                </button>
            </div>

            <div class="card">
                <div class="card-body">
                    <table>
                        <thead>
                            <tr>
                                <th>Rol</th>
                                <th>Nivel</th>
                                <th>Permisos</th>
                                <th>Usuarios</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="roles-table"></tbody>
                    </table>
                </div>
            </div>

            <div class="card" style="margin-top:24px">
                <div class="card-header">
                    <div class="card-title">Todos los Permisos del Sistema</div>
                </div>
                <div class="card-body">
                    <div id="all-permissions-list"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Rol -->
    <div class="modal-overlay" id="role-modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">Nuevo Rol</div>
                <button class="modal-close" onclick="closeRoleModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="role-form">
                    <input type="hidden" id="role-id">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Nombre (código) *</label>
                            <input type="text" class="form-input" id="role-nombre" placeholder="ej: coordinador" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Nombre visible *</label>
                            <input type="text" class="form-input" id="role-display-name" placeholder="ej: Coordinador" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Descripción</label>
                        <input type="text" class="form-input" id="role-descripcion">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nivel (1=máximo poder)</label>
                        <input type="number" class="form-input" id="role-nivel" value="50" min="1" max="100">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Permisos</label>
                        <div id="permissions-list"></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeRoleModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveRole()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="/toast.js"></script>
    <script>
        const API_URL = '/api';
        let token = localStorage.getItem('nexora_token');
        if (!token) { window.location.href = '/index.html'; }

        const userStr = localStorage.getItem('nexora_user');
        if (userStr) {
            const user = JSON.parse(userStr);

            // Verificar que es superadmin
            const isSuperadmin = user.roles?.some(r => r.nombre === 'superadmin');
            if (!isSuperadmin) {
                document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;"><div style="text-align:center;"><h1 style="color:var(--danger)">Acceso Denegado</h1><p style="color:var(--text-mut)">Solo el superadministrador puede gestionar roles y permisos</p><button onclick="location.href=\'/dashboard.html\'" style="margin-top:16px;padding:10px 20px;background:var(--accent);color:white;border:none;border-radius:8px;cursor:pointer">Volver al Dashboard</button></div></div>';
            }
        }

        function logout() {
            localStorage.removeItem('nexora_token');
            localStorage.removeItem('nexora_user');
            window.location.href = '/index.html';
        }

        const _fetch = window.fetch;
        window.fetch = function(...args) {
            return _fetch.apply(this, args).then(res => {
                if (res.status === 401) {
                    Toast.warning('Sesión expirada', '...');
                    setTimeout(logout, 1500);
                }
                return res;
            });
        };

        let allRoles = [];
        let allPermissions = [];

        async function loadRoles() {
            try {
                const res = await fetch(`${API_URL}/roles`, { headers: { 'Authorization': 'Bearer ' + token } });
                if (res.ok) {
                    const data = await res.json();
                    allRoles = data.data || [];
                    renderRoles();
                }
            } catch (e) {}
        }

        function renderRoles() {
            const tbody = document.getElementById('roles-table');
            const protectedRoles = ['superadmin', 'admin', 'vendedor', 'contador', 'cliente'];
            
            tbody.innerHTML = allRoles.map(r => {
                const isProtected = protectedRoles.includes(r.nombre);
                return `
                    <tr>
                        <td>
                            <div style="font-weight:500;color:var(--text)">${r.display_name}</div>
                            <div style="font-size:11px;color:var(--text-mut)">${r.nombre}</div>
                            ${isProtected ? '<span class="protected-badge">Protegido</span>' : ''}
                        </td>
                        <td style="font-family:'DM Mono',monospace">${r.nivel}</td>
                        <td><span class="badge badge-blue">${r.permisos?.length || 0} permisos</span></td>
                        <td>${r.usuarios?.length || 0}</td>
                        <td><span class="badge ${r.activo ? 'badge-blue' : 'badge-gray'}">${r.activo ? 'Activo' : 'Inactivo'}</span></td>
                        <td>
                            <div class="actions">
                                ${!isProtected ? `
                                    <button class="action-btn" onclick="editRole(${r.id})" title="Editar">
                                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                    </button>
                                    <button class="action-btn" onclick="deleteRole(${r.id})" title="Eliminar">
                                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline x1="3" y1="6" x2="21" y2="6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                    </button>
                                ` : `
                                    <button class="action-btn" onclick="editRole(${r.id})" title="Ver permisos">
                                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                    </button>
                                `}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function loadPermissions() {
            try {
                const res = await fetch(`${API_URL}/permissions`, { headers: { 'Authorization': 'Bearer ' + token } });
                if (res.ok) {
                    const data = await res.json();
                    allPermissions = data.data || [];
                    renderAllPermissions();
                }
            } catch (e) {}
        }

        function renderAllPermissions() {
            const container = document.getElementById('all-permissions-list');
            const grouped = {};
            allPermissions.forEach(p => {
                if (!grouped[p.modulo]) grouped[p.modulo] = [];
                grouped[p.modulo].push(p);
            });

            container.innerHTML = Object.keys(grouped).sort().map(modulo => `
                <div class="module-section">
                    <div class="module-title">${modulo.charAt(0).toUpperCase() + modulo.slice(1)}</div>
                    <div class="module-perms">
                        ${grouped[modulo].map(p => `
                            <label>
                                <input type="checkbox" disabled>
                                ${p.nombre}
                            </label>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function openRoleModal() {
            document.getElementById('modal-title').textContent = 'Nuevo Rol';
            document.getElementById('role-form').reset();
            document.getElementById('role-id').value = '';
            document.getElementById('role-nombre').disabled = false;
            renderPermissionsCheckboxes();
            document.getElementById('role-modal').classList.add('active');
        }

        function closeRoleModal() {
            document.getElementById('role-modal').classList.remove('active');
        }

        function renderPermissionsCheckboxes() {
            const container = document.getElementById('permissions-list');
            const grouped = {};
            allPermissions.forEach(p => {
                if (!grouped[p.modulo]) grouped[p.modulo] = [];
                grouped[p.modulo].push(p);
            });

            container.innerHTML = Object.keys(grouped).sort().map(modulo => `
                <div class="module-section">
                    <div class="module-title">${modulo.charAt(0).toUpperCase() + modulo.slice(1)}</div>
                    <div class="module-perms">
                        ${grouped[modulo].map(p => `
                            <label>
                                <input type="checkbox" value="${p.id}" data-perm="${p.codigo}">
                                ${p.nombre}
                            </label>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        async function editRole(id) {
            try {
                const res = await fetch(`${API_URL}/roles/${id}`, { headers: { 'Authorization': 'Bearer ' + token } });
                if (res.ok) {
                    const data = await res.json();
                    const r = data.data;
                    document.getElementById('modal-title').textContent = 'Editar Rol';
                    document.getElementById('role-id').value = r.id;
                    document.getElementById('role-nombre').value = r.nombre;
                    document.getElementById('role-nombre').disabled = true;
                    document.getElementById('role-display-name').value = r.display_name;
                    document.getElementById('role-descripcion').value = r.descripcion || '';
                    document.getElementById('role-nivel').value = r.nivel;

                    renderPermissionsCheckboxes();

                    if (r.permisos) {
                        r.permisos.forEach(perm => {
                            const checkbox = document.querySelector(`input[data-perm="${perm.codigo}"]`);
                            if (checkbox) checkbox.checked = true;
                        });
                    }

                    document.getElementById('role-modal').classList.add('active');
                }
            } catch (e) {
                Toast.error('Error', 'No se pudo cargar el rol');
            }
        }

        async function saveRole() {
            const id = document.getElementById('role-id').value;
            const nombre = document.getElementById('role-nombre').value.trim();
            const display_name = document.getElementById('role-display-name').value.trim();
            const descripcion = document.getElementById('role-descripcion').value.trim();
            const nivel = parseInt(document.getElementById('role-nivel').value);

            if (!nombre || !display_name) {
                Toast.warning('Campos requeridos', 'Nombre y nombre visible son obligatorios');
                return;
            }

            const permCheckboxes = document.querySelectorAll('#permissions-list input:checked');
            const permiso_ids = Array.from(permCheckboxes).map(cb => parseInt(cb.value));

            const body = { nombre, display_name, descripcion, nivel, permiso_ids };

            try {
                let res;
                if (id) {
                    res = await fetch(`${API_URL}/roles/${id}`, {
                        method: 'PUT',
                        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                } else {
                    res = await fetch(`${API_URL}/roles`, {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                }

                const data = await res.json();
                if (res.ok) {
                    Toast.success('Éxito', id ? 'Rol actualizado' : 'Rol creado');
                    closeRoleModal();
                    loadRoles();
                } else {
                    Toast.error('Error', data.error?.message || 'Error al guardar');
                }
            } catch (e) {
                Toast.error('Error', 'Error de conexión');
            }
        }

        async function deleteRole(id) {
            if (!confirm('¿Estás seguro de eliminar este rol?')) return;
            try {
                const res = await fetch(`${API_URL}/roles/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (res.ok) {
                    Toast.success('Éxito', 'Rol eliminado');
                    loadRoles();
                } else {
                    Toast.error('Error', data.error?.message || 'Error al eliminar');
                }
            } catch (e) {
                Toast.error('Error', 'Error de conexión');
            }
        }

        loadRoles();
        loadPermissions();
    </script>
    <script src="/topbar.js"></script>
    <script src="/sidebar.js"></script>
</body>
</html>
